# Cloudflare 部署配置模板。实际使用的是 server/wrangler.toml（不提交）：
# pnpm setup:cf 会在它不存在时从本文件生成；正式站点建议放在单独的部署仓库中管理。
name = "outflow"
main = "src/entry/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 由 scripts/setup-cf.mjs 自动填写 database_id；同一账号部署多个站点时请修改 database_name、bucket_name 与下方限流的 namespace_id
[[d1_databases]]
binding = "DB"
database_name = "outflow"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "outflow-uploads"

[[durable_objects.bindings]]
name = "COLLAB"
class_name = "CollabRoom"

[[migrations]]
tag = "v1"
new_classes = ["CollabRoom"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 限流：period 只能是 10 或 60 秒；同一账号部署多个站点时 namespace_id 也要各不相同，否则会共用计数
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_READ"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[vars]
APP_NAME = "Outflow"
# 留空则使用请求的 origin
APP_URL = ""
# 逗号分隔：*.edu.cn（含子域）、@pku.edu.cn（精确域名）、someone@gmail.com（单个邮箱）
ALLOWED_EMAIL_DOMAINS = "*.edu.cn"
REGISTRATION_ENABLED = "true"
# altcha | turnstile | hcaptcha | none
CAPTCHA_PROVIDER = "altcha"
# 登录验证：always（每次都要）| after_failures（连续失败 3 次后才要）
LOGIN_CAPTCHA = "always"
# 地域白名单：ISO 两位代码，逗号分隔，留空 = 不限制；Cloudflare 自动识别请求地区。管理后台可覆盖
GEO_REGISTER_COUNTRIES = "CN,HK"
GEO_LOGIN_COUNTRIES = ""
# 无法识别地区（如 Tor）时：deny | allow
GEO_UNKNOWN = "deny"
CAPTCHA_SITE_KEY = ""
# 留空自动选择（配了 SMTP_HOST 用 smtp，配了 RESEND_API_KEY 用 resend，都没有则无法发送验证码）
# console 仅把邮件打印到日志，切勿用于生产
MAIL_DRIVER = ""
MAIL_FROM = "Outflow <noreply@example.com>"
SMTP_HOST = ""
SMTP_PORT = "465"
SMTP_SECURE = "true"
SMTP_USER = ""
# 机密项用 wrangler secret put 设置：SESSION_SECRET、SMTP_PASS、CAPTCHA_SECRET、RESEND_API_KEY
